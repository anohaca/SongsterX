# SongsterX Gateway example. Copy into the app's SongsterX.conf or edit it in the UI.

[General]
format-version = 1
mode = gateway-no-dhcp
listen = 127.0.0.1
port = 2080
dns-mode = fakeip
dns-server = 223.5.5.5
log-level = info
gateway-guest-lan-selector = "if:eth0"
gateway-guest-host-selector = "if:eth1"
gateway-upstream-gateway = 192.168.88.1
# gateway-guest-kernel = "/path/to/gateway-guest/kernel"
# gateway-guest-initrd = "/path/to/gateway-guest/initrd"
# vfkit-path = "/opt/homebrew/bin/vfkit"
# vmnet-helper-path = "/path/to/vmnet-helper"
# Before starting, set SONGSTERX_GATEWAY_AGENT_TOKEN_FILE to the generated
# agent.token from scripts/build_gateway_guest.sh.

[Gateway]
enabled = true
interface = en0
gateway-ip = 192.168.88.2
cidr = 192.168.88.0/24
dns-ip = 198.18.0.2
dhcp = false
ipv6 = false
client-policy = all
clients = ""

# To restrict access instead, use:
# client-policy = allowlist
# clients = "192.168.88.20,aa:bb:cc:dd:ee:ff\\n192.168.88.21,11:22:33:44:55:66"
