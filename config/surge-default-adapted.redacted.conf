# Adaptation of the supplied Surge profile.
# Secrets from the source profile are intentionally replaced with placeholders.

[General]
external-controller-access = <LOCAL_CONTROLLER_TOKEN>@127.0.0.1:6155
http-api = <LOCAL_HTTP_API_TOKEN>@127.0.0.1:6200
http-api-web-dashboard = false
ipv6 = false
ipv6-vif = auto
always-raw-tcp-keywords = m4s, m3u8, ifs, bundle
always-real-ip = stun*, humb.v.aaplimg.com, *.push.apple.com, humb.apple.com
tun-excluded-routes = 223.86.225.0/24
dns-server = 218.6.200.139, 61.139.2.69, 223.5.5.5
skip-proxy = *.local., humb.apple.com, *.push.apple.com

# Surge VM Gateway mode has no DHCP. Every client sets VM Gateway and FakeIP DNS manually.
gateway-mode = vmnet-l2-no-dhcp
vm-gateway-ip = <SONGSTERX_VM_GATEWAY_IP>
vm-gateway-cidr = 192.168.88.0/24
fakeip-dns-ip = 198.18.0.2

[Proxy]
ad = http, 127.0.0.1, 3128
tunnel = trojan, 162.159.45.195, 443, password=<TROJAN_PASSWORD>, ws=true, ws-path=/e26ae2d90dcd920b9a6609fd, ws-headers=Host:"speedtest.mobeni.eu.org", skip-cert-verify=true, sni=speedtest.mobeni.eu.org
sn = snell, 172.64.229.216, 80, psk=<SNELL_PSK>, version=4, reuse=true, obfs=http, obfs-host=hyper.mobeni.eu.org

[Proxy Group]
ikuu = smart, policy-path=<REDACTED_POLICY_URL>, update-interval=0, include-all-proxies=0, evaluate-before-use=1
Final = select, ikuu, smart, no-alert=0, hidden=0, include-all-proxies=1
smart = smart, tunnel, sn, include-all-proxies=0

[Rule]
DEST-PORT,8000,REJECT,pre-matching
# PROCESS-NAME is host-only; remote gateway clients use LAN source-IP/MAC learning.
# The following source logical rules are preserved for review only. They are not
# active in M0 because RuleCompiler, remote source context, and Surge JS are not
# implemented. See config/surge-logic-rules.redacted.json.
# AND,((HOSTNAME-TYPE,DOMAIN),(OR,((SRC-IP,192.168.88.242),(SRC-IP,192.168.88.240),(SRC-IP,192.168.88.246),(SRC-IP,192.168.88.243))),(OR,((PROTOCOL,HTTPS),(PROTOCOL,HTTP))),(NOT,((OR,((DOMAIN-KEYWORD,byte,extended-matching),(DOMAIN-KEYWORD,icloud,extended-matching),(DOMAIN-KEYWORD,apple,extended-matching),(DOMAIN-KEYWORD,tiktok,extended-matching),(DOMAIN-KEYWORD,douyin,extended-matching))))),ad
# PROCESS-NAME,/Applications/qbittorrent.app/Contents/MacOS/qbittorrent,DIRECT
# AND,((SRC-IP,192.168.64.0/16),(DOMAIN,api.day.app),(SCRIPT,EmbyRefresh)),DIRECT
DOMAIN,linux.do,Final
DOMAIN-SUFFIX,v2ex.com,Final
DOMAIN-SUFFIX,openai.com,Final
DOMAIN-SUFFIX,chatgpt.com,Final
DOMAIN-SUFFIX,googleapis.cn,Final
DOMAIN-SUFFIX,nodeseek.com,Final
DOMAIN-SUFFIX,steamserver.net,DIRECT
DOMAIN,gateway.icloud.com,DIRECT,extended-matching
DOMAIN,iosapps.itunes.apple.com,DIRECT
# Source Default.conf literal: IP-CIDR,192.168.88.1/16,DIRECT,no-resolve.
# M0 Gateway config intentionally narrows the static LAN to 192.168.88.0/24.
IP-CIDR,192.168.88.1/16,DIRECT,no-resolve
GEOIP,CN,DIRECT
IP-CIDR,172.64.229.216/32,DIRECT
FINAL,Final,dns-failed

[Host]
iosapps.itunes.apple.com = 17.253.85.142
hanime1.me = 172.64.229.216
cm.cdn.bgp.yt = 172.64.229.216
*.acgrip.com = 172.64.229.216
18comic.vip = 172.64.229.216
jm18* = 172.64.229.216
missav.ws = 172.64.229.216
www.wenku8.net = 172.64.229.216

[MITM]
h2 = true
client-source-address = <STATIC_CLIENT_MAC_1>, <STATIC_CLIENT_MAC_2>
ca-keystore-name = MITM
hostname = api.day.app

[Script]
# SongsterX: HTTP Script is executed from pinned local assets by the QuickJS addon.
# EmbyRefresh = type=rule,pattern=^https?://api\\.day\\.app,script-path=emby-refresh.js

[Keystore]
# The supplied P12/base64 and password are intentionally not copied.
MITM = external-keychain://MITM
